<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recuperar Contraseña - El Sabor Explosivo</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Bebas+Neue&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
            display: ['Bebas Neue', 'Anton', 'Impact', 'sans-serif']
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="css/styles.css">
<meta name="currency" content="CLP">
</head>
<body data-page="recuperar" class="min-h-screen flex flex-col bg-amber-50">
  <div data-header></div>

  <main class="flex-1 container-page px-4 py-10">
    <div class="max-w-md mx-auto">
      <div class="text-center mb-8">
        <div class="w-20 h-20 bg-gradient-to-br from-red-500 to-yellow-500 rounded-2xl flex items-center justify-center text-4xl mx-auto mb-4 shadow-lg">🔑</div>
        <h1 class="font-display text-4xl font-bold text-gray-900">Recuperar contraseña</h1>
        <p class="text-gray-600 mt-2">Te enviaremos un enlace para restablecer tu contraseña</p>
      </div>

      <div class="bg-white rounded-2xl shadow-xl p-8">
        <div class="bg-blue-50 border-l-4 border-blue-500 p-4 rounded mb-6">
          <p class="text-sm text-gray-700">
            <strong>📧 ¿Cómo funciona?</strong><br>
            Ingresa el email asociado a tu cuenta y te enviaremos un enlace para que puedas crear una nueva contraseña.
          </p>
        </div>

        <form id="recuperar-form" class="space-y-4">
          <div class="form-group">
            <label>Email de tu cuenta</label>
            <input name="email" type="email" required placeholder="tu@email.com">
          </div>
          <button type="submit" class="btn-primary w-full py-4 text-lg">📧 Enviar enlace de recuperación</button>
        </form>

        <div class="mt-6 text-center">
          <p class="text-gray-600"><a href="login.html" class="text-red-600 font-bold hover:underline">← Volver al inicio de sesión</a></p>
        </div>
      </div>

      <div class="mt-6 text-center text-sm text-gray-600">
        <p>¿No tienes cuenta? <a href="registro.html" class="text-red-600 font-bold hover:underline">Regístrate aquí</a></p>
      </div>
    </div>
  </main>

  <div data-footer></div>

  <script src="js/data.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
